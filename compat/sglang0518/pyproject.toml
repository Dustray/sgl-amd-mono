[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "sgl-amd-mono-sglang0518"
version = "0.1.0+gfx936.20261105"
description = "gfx936 BF16 dense Qwen cooperative Monokernel integration for SGLang 0.5.18 DTK"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["sgl-amd-mono==0.1.0.dev0"]

[project.entry-points."sglang.srt.plugins"]
sgl_amd_mono_0518 = "sgl_amd_mono_0518.bootstrap:register"
sgl_amd_mono_flash_next_0518 = "sgl_amd_mono_0518.flash_next:register"

[project.scripts]
sgl-amd-mono-0518 = "sgl_amd_mono_0518.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sgl_amd_mono_0518 = ["manifest.json"]
